<div id="sec-tablerobi">
<style>
#sec-tablerobi { display:none;overflow:auto;position:absolute;top:56px;left:0;right:0;bottom:0;background:var(--bg,#F2F3F5); }
#sec-tablerobi.activo { display:block; }
#sec-tablerobi .kpi-wrap { padding:20px 24px;max-width:1200px;margin:0 auto; }
#sec-tablerobi .kpi-title { font-size:18px;font-weight:600;color:#1A1A1A; }
#sec-tablerobi .kpi-sub { font-size:13px;color:#6B7280;margin-bottom:16px; }
#sec-tablerobi .kpi-per { display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center; }
#sec-tablerobi .kpi-pbtn { padding:5px 13px;border:1px solid #DADCE0;background:#fff;border-radius:20px;font-size:12.5px;cursor:pointer;color:#5A5F66;transition:all .15s;font-family:inherit; }
#sec-tablerobi .kpi-pbtn:hover { border-color:#1A6FC4;color:#1A6FC4; }
#sec-tablerobi .kpi-pbtn.on { background:#1A6FC4;border-color:#1A6FC4;color:#fff;font-weight:600; }
#sec-tablerobi .kpi-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:16px; }
#sec-tablerobi .kpi-card { background:#fff;border:1px solid #EEF0F3;border-radius:12px;padding:18px; }
#sec-tablerobi .kpi-lbl { font-size:12px;color:#6B7280;margin-bottom:6px; }
#sec-tablerobi .kpi-val { font-size:30px;font-weight:700;color:#1A1A1A;line-height:1.1; }
#sec-tablerobi .kpi-foot { font-size:11.5px;color:#9AA0A6;margin-top:6px; }
#sec-tablerobi .kpi-bar-row { display:flex;align-items:center;gap:10px;margin-bottom:8px; }
#sec-tablerobi .kpi-bar-name { font-size:12.5px;color:#3A3A3A;width:150px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
#sec-tablerobi .kpi-bar-track { flex:1;background:#F0F2F5;border-radius:6px;height:20px;overflow:hidden; }
#sec-tablerobi .kpi-bar-fill { background:linear-gradient(90deg,#1A6FC4,#3E8FD8);height:100%;border-radius:6px; }
#sec-tablerobi .kpi-bar-val { font-size:12px;color:#1A1A1A;font-weight:600;width:90px;text-align:right;flex-shrink:0; }
#sec-tablerobi .kpi-sec-tit { font-size:14px;font-weight:600;color:#1A1A1A;margin:4px 0 12px; }
#sec-tablerobi .kpi-cmp { display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px; }
#sec-tablerobi .kpi-cmp-card { background:#fff;border:1px solid #EEF0F3;border-radius:12px;padding:16px;text-align:center; }
#sec-tablerobi .kpi-cmp-val { font-size:22px;font-weight:700;color:#1A1A1A; }
#sec-tablerobi .kpi-cmp-prev { font-size:11.5px;color:#9AA0A6;margin-top:4px; }
#sec-tablerobi .kpi-var { display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;margin-top:6px; }
#sec-tablerobi .kpi-up { background:#E7F7EF;color:#0A7A3F; }
#sec-tablerobi .kpi-down { background:#FFEDEA;color:#C8241A; }
#sec-tablerobi .kpi-loading { color:#9AA0A6;font-size:13px;padding:20px 0;text-align:center; }
#sec-tablerobi .kpi-noadmin { background:#FFF7E6;border:1px solid #FFE0A3;color:#8A6D00;border-radius:10px;padding:14px 16px;font-size:13px; }
</style>

<div class="kpi-wrap">
  <div class="kpi-title">Indicadores de gestion</div>
  <div class="kpi-sub">Como va la clinica, calculado desde tus propios datos.</div>
  <div class="kpi-per" id="kpi-periodo">
    <span style="font-size:12px;font-weight:600;color:#5A5F66">Periodo:</span>
    <button class="kpi-pbtn" id="kpi-p-HOY" onclick="kpiCargar('HOY')">Hoy</button>
    <button class="kpi-pbtn" id="kpi-p-SEMANA" onclick="kpiCargar('SEMANA')">Esta semana</button>
    <button class="kpi-pbtn on" id="kpi-p-MES" onclick="kpiCargar('MES')">Este mes</button>
    <button class="kpi-pbtn" id="kpi-p-MES_PASADO" onclick="kpiCargar('MES_PASADO')">Mes pasado</button>
    <span id="kpi-rango" style="font-size:11px;color:#9AA0A6;margin-left:auto"></span>
  </div>
  <div id="kpi-body"><div class="kpi-loading">Cargando indicadores...</div></div>
</div>

<script>
function kpiAbrir() {
  window.kpiPeriodo = window.kpiPeriodo || 'MES';
  kpiCargar(window.kpiPeriodo);
}

function kpiCargar(periodo) {
  window.kpiPeriodo = periodo || 'MES';
  ['HOY','SEMANA','MES','MES_PASADO'].forEach(function(p){
    var b = document.getElementById('kpi-p-' + p);
    if (b) { if (p === window.kpiPeriodo) b.classList.add('on'); else b.classList.remove('on'); }
  });
  var body = document.getElementById('kpi-body');
  body.innerHTML = '<div class="kpi-loading">Calculando...</div>';
  google.script.run.withSuccessHandler(function(resp){
    if (!resp || !resp.ok) {
      body.innerHTML = '<div class="kpi-noadmin">' + (resp ? resp.mensaje : 'No se pudo cargar.') + '</div>';
      return;
    }
    kpiRender(resp.datos);
  }).withFailureHandler(function(e){
    body.innerHTML = '<div class="kpi-noadmin">Error: ' + e.message + '</div>';
  }).ejecutar('obtenerIndicadores', { periodo: window.kpiPeriodo, usuario:(sesion&&sesion.USUARIO)||'', rol:(sesion&&sesion.ROL)||'', token:(sesion&&sesion.TOKEN)||'' });
}

function kpiRender(d) {
  var lbl = document.getElementById('kpi-rango');
  if (lbl) lbl.textContent = d.periodoEtiqueta + ' (' + d.desde + ' a ' + d.hasta + ')';

  var html = '';

  // Tarjetas principales
  html += '<div class="kpi-grid">';
  html += kpiCard('Tasa de ocupacion', d.ocupacion + '%', d.atendidas + ' de ' + d.agendadas + ' citas atendidas');
  html += kpiCard('Ticket promedio', 'S/ ' + d.ticketPromedio.toFixed(2), d.nVentas + ' venta(s) en el periodo');
  html += kpiCard('Ingresos', 'S/ ' + d.totalVentas.toFixed(2), d.nPacientes + ' paciente(s) atendido(s)');
  html += kpiCard('Citas canceladas', d.canceladas, 'en el periodo seleccionado');
  html += '</div>';

  // Ingreso por especialidad
  html += '<div class="kpi-card"><div class="kpi-sec-tit">Ingreso por especialidad</div>';
  html += kpiBarras(d.ingresoEspecialidad);
  html += '</div>';

  // Ingreso por servicio (top 8)
  html += '<div class="kpi-card"><div class="kpi-sec-tit">Top servicios por ingreso</div>';
  html += kpiBarras(d.ingresoServicio);
  html += '</div>';

  // Comparativo mes vs mes
  var c = d.comparativo;
  html += '<div class="kpi-card"><div class="kpi-sec-tit">Este mes vs mes anterior</div>';
  html += '<div class="kpi-cmp">';
  html += kpiCompCard('Ventas', 'S/ ' + c.ventasActual.toFixed(2), 'S/ ' + c.ventasPrev.toFixed(2), c.ventasVar);
  html += kpiCompCard('Citas', c.citasActual, c.citasPrev, c.citasVar);
  html += kpiCompCard('Pacientes', c.pacientesActual, c.pacientesPrev, c.pacientesVar);
  html += '</div></div>';

  document.getElementById('kpi-body').innerHTML = html;
}

function kpiCard(lbl, val, foot) {
  return '<div class="kpi-card"><div class="kpi-lbl">' + lbl + '</div>' +
    '<div class="kpi-val">' + val + '</div>' +
    '<div class="kpi-foot">' + foot + '</div></div>';
}

function kpiBarras(lista) {
  if (!lista || !lista.length) return '<div style="color:#9AA0A6;font-size:12.5px">Sin datos en este periodo.</div>';
  var max = lista[0].monto || 1;
  return lista.map(function(x){
    var pct = max > 0 ? Math.round((x.monto / max) * 100) : 0;
    return '<div class="kpi-bar-row">' +
      '<div class="kpi-bar-name" title="' + x.nombre + '">' + x.nombre + '</div>' +
      '<div class="kpi-bar-track"><div class="kpi-bar-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="kpi-bar-val">S/ ' + x.monto.toFixed(2) + '</div></div>';
  }).join('');
}

function kpiCompCard(lbl, actual, prev, varPct) {
  var arriba = varPct >= 0;
  var chip = '<span class="kpi-var ' + (arriba ? 'kpi-up' : 'kpi-down') + '">' +
    (arriba ? '\u25B2 ' : '\u25BC ') + Math.abs(varPct) + '%</span>';
  return '<div class="kpi-cmp-card"><div class="kpi-lbl">' + lbl + '</div>' +
    '<div class="kpi-cmp-val">' + actual + '</div>' + chip +
    '<div class="kpi-cmp-prev">antes: ' + prev + '</div></div>';
}
</script>
</div>
